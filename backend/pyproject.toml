[project]
name = "spotify-rag-backend"
version = "0.1.0"
description = "FastAPI + LangChain RAG backend for personal Spotify recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.162.7",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "pydantic-settings>=2.16.3",
    "requests-cache>=1.3.3",
    "sentence-transformers>=6.3.0",
    "spotipy>=2.26.0",
    "sse-starlette>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
